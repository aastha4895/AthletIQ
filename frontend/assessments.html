<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Assessments - AthletIQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .assessment-card {
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        .assessment-card:hover {
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }
        .status-badge {
            font-size: 0.8em;
            padding: 4px 8px;
            border-radius: 15px;
        }
        .status-processing { background: #fff3cd; color: #856404; }
        .status-completed { background: #d1edff; color: #0c5460; }
        .status-flagged { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <i class="fas fa-trophy"></i> AthletIQ
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="dashboard.html">Dashboard</a>
                <a class="nav-link active" href="assessments.html">My Assessments</a>
                <a class="nav-link" href="profile.html">Profile</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h2><i class="fas fa-chart-line"></i> My Assessments</h2>
                <p class="text-muted">View your performance assessments and AI analysis results</p>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div id="assessmentsList">
                    <div class="text-center py-5">
                        <i class="fas fa-spinner fa-spin fa-2x text-primary"></i>
                        <p class="mt-3">Loading your assessments...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        // Load assessments on page load
        document.addEventListener('DOMContentLoaded', loadAssessments);

        async function loadAssessments() {
            try {
                const response = await api.getAssessments();
                displayAssessments(response.assessments || []);
            } catch (error) {
                console.error('Failed to load assessments:', error);
                document.getElementById('assessmentsList').innerHTML = `
                    <div class="alert alert-warning">
                        <i class="fas fa-exclamation-triangle"></i>
                        Failed to load assessments. Please try again later.
                    </div>
                `;
            }
        }

        function displayAssessments(assessments) {
            const container = document.getElementById('assessmentsList');
            
            if (assessments.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-5">
                        <i class="fas fa-video fa-3x text-muted mb-3"></i>
                        <h4>No Assessments Yet</h4>
                        <p class="text-muted">Upload your first performance video to get started!</p>
                        <a href="dashboard.html" class="btn btn-primary">
                            <i class="fas fa-plus"></i> Create Assessment
                        </a>
                    </div>
                `;
                return;
            }

            const assessmentCards = assessments.map(assessment => `
                <div class="assessment-card">
                    <div class="row align-items-center">
                        <div class="col-md-8">
                            <h5 class="mb-2">
                                <i class="fas fa-${getSportIcon(assessment.testType)}"></i>
                                ${assessment.testType}
                            </h5>
                            <p class="text-muted mb-2">
                                <i class="fas fa-calendar"></i>
                                ${new Date(assessment.createdAt).toLocaleDateString()}
                            </p>
                            ${assessment.aiAnalysis?.score ? `
                                <p class="mb-0">
                                    <strong>AI Score:</strong> ${assessment.aiAnalysis.score}
                                    <span class="text-muted">(${Math.round(assessment.aiAnalysis.confidence * 100)}% confidence)</span>
                                </p>
                            ` : ''}
                        </div>
                        <div class="col-md-4 text-end">
                            <span class="status-badge status-${assessment.status}">
                                ${assessment.status.toUpperCase()}
                            </span>
                            <div class="mt-2">
                                <button class="btn btn-sm btn-outline-primary" onclick="viewAssessment('${assessment._id}')">
                                    <i class="fas fa-eye"></i> View Details
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            container.innerHTML = assessmentCards;
        }

        function getSportIcon(sport) {
            const icons = {
                'football': 'futbol',
                'basketball': 'basketball-ball',
                'tennis': 'table-tennis',
                'running': 'running',
                'swimming': 'swimmer',
                'Vertical Jump': 'arrow-up',
                'Shuttle Run': 'exchange-alt',
                'Sit-ups': 'dumbbell',
                'Endurance Run': 'running',
                'Height & Weight': 'weight'
            };
            return icons[sport] || 'trophy';
        }

        async function viewAssessment(assessmentId) {
            try {
                const response = await api.getAssessment(assessmentId);
                const assessment = response.assessment;
                
                // Show assessment details in modal or new page
                alert(`Assessment Details:\n\nSport: ${assessment.testType}\nStatus: ${assessment.status}\nDate: ${new Date(assessment.createdAt).toLocaleDateString()}\n\n${assessment.aiAnalysis?.score ? `AI Score: ${assessment.aiAnalysis.score}` : 'Processing...'}`);
            } catch (error) {
                alert('Failed to load assessment details');
            }
        }
    </script>
</body>
</html>
