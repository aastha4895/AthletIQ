<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Integration Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 2rem; }
        .test-section { margin: 2rem 0; padding: 1rem; border: 1px solid #ddd; border-radius: 8px; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        button { padding: 0.5rem 1rem; margin: 0.5rem; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔧 Backend Integration Test</h1>
    <p>This page tests the connection between frontend and backend.</p>

    <div class="test-section">
        <h3>API Connection Test</h3>
        <button onclick="testConnection()">Test Backend Connection</button>
        <div id="connectionResult"></div>
    </div>

    <div class="test-section">
        <h3>Authentication Test</h3>
        <input type="email" id="testEmail" placeholder="test@example.com" value="test@example.com">
        <input type="password" id="testPassword" placeholder="password" value="password123">
        <button onclick="testRegister()">Test Register</button>
        <button onclick="testLogin()">Test Login</button>
        <div id="authResult"></div>
    </div>

    <div class="test-section">
        <h3>Profile Test</h3>
        <button onclick="testProfile()">Test Get Profile</button>
        <button onclick="testUpdateProfile()">Test Update Profile</button>
        <div id="profileResult"></div>
    </div>

    <div class="test-section">
        <h3>Assessment Test</h3>
        <button onclick="testAssessment()">Test Submit Assessment</button>
        <button onclick="testGetAssessments()">Test Get Assessments</button>
        <div id="assessmentResult"></div>
    </div>

    <script src="js/api.js"></script>
    <script>
        async function testConnection() {
            const result = document.getElementById('connectionResult');
            result.innerHTML = 'Testing connection...';
            
            try {
                const response = await fetch('http://localhost:3001/health');
                if (response.ok) {
                    result.innerHTML = '<div class="success">✅ Backend connection successful!</div>';
                } else {
                    result.innerHTML = '<div class="error">❌ Backend responded with error</div>';
                }
            } catch (error) {
                result.innerHTML = `<div class="error">❌ Connection failed: ${error.message}</div>`;
            }
        }

        async function testRegister() {
            const result = document.getElementById('authResult');
            const email = document.getElementById('testEmail').value;
            const password = document.getElementById('testPassword').value;
            
            result.innerHTML = 'Testing registration...';
            
            try {
                const response = await api.register({
                    name: 'Test User',
                    email: email,
                    password: password,
                    sportsInterests: ['football']
                });
                result.innerHTML = '<div class="success">✅ Registration successful!</div>';
            } catch (error) {
                result.innerHTML = `<div class="error">❌ Registration failed: ${error.message}</div>`;
            }
        }

        async function testLogin() {
            const result = document.getElementById('authResult');
            const email = document.getElementById('testEmail').value;
            const password = document.getElementById('testPassword').value;
            
            result.innerHTML = 'Testing login...';
            
            try {
                const response = await api.login(email, password);
                result.innerHTML = '<div class="success">✅ Login successful!</div>';
            } catch (error) {
                result.innerHTML = `<div class="error">❌ Login failed: ${error.message}</div>`;
            }
        }

        async function testProfile() {
            const result = document.getElementById('profileResult');
            result.innerHTML = 'Testing get profile...';
            
            try {
                const profile = await api.getProfile();
                result.innerHTML = `<div class="success">✅ Profile loaded: ${JSON.stringify(profile, null, 2)}</div>`;
            } catch (error) {
                result.innerHTML = `<div class="error">❌ Profile failed: ${error.message}</div>`;
            }
        }

        async function testUpdateProfile() {
            const result = document.getElementById('profileResult');
            result.innerHTML = 'Testing update profile...';
            
            try {
                const response = await api.updateProfile({
                    name: 'Updated Test User',
                    sportsInterests: ['basketball', 'tennis']
                });
                result.innerHTML = '<div class="success">✅ Profile updated successfully!</div>';
            } catch (error) {
                result.innerHTML = `<div class="error">❌ Profile update failed: ${error.message}</div>`;
            }
        }

        async function testAssessment() {
            const result = document.getElementById('assessmentResult');
            result.innerHTML = 'Testing submit assessment...';
            
            try {
                const response = await api.submitAssessment({
                    testType: 'Vertical Jump',
                    videoUrl: 'test-video.mp4',
                    metadata: { test: true }
                });
                result.innerHTML = '<div class="success">✅ Assessment submitted successfully!</div>';
            } catch (error) {
                result.innerHTML = `<div class="error">❌ Assessment failed: ${error.message}</div>`;
            }
        }

        async function testGetAssessments() {
            const result = document.getElementById('assessmentResult');
            result.innerHTML = 'Testing get assessments...';
            
            try {
                const assessments = await api.getAssessments();
                result.innerHTML = `<div class="success">✅ Assessments loaded: ${assessments.length} found</div>`;
            } catch (error) {
                result.innerHTML = `<div class="error">❌ Get assessments failed: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
