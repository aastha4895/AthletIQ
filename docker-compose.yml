version: '3.8'

services:
  mongodb:
    image: mongo:5.0
    container_name: athletiq-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: athletiq
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./backend/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - athletiq-network

  redis:
    image: redis:7-alpine
    container_name: athletiq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - athletiq-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: athletiq-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/athletiq?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your_super_secret_jwt_key_here
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - athletiq-network

  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: athletiq-admin
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - athletiq-network

  nginx:
    image: nginx:alpine
    container_name: athletiq-nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - admin-dashboard
    networks:
      - athletiq-network

volumes:
  mongodb_data:
  redis_data:

networks:
  athletiq-network:
    driver: bridge